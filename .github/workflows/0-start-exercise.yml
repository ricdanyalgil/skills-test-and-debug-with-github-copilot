name: Step 0

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: start-exercise-${{ github.repository }}
  cancel-in-progress: true

env:
  STEP_1_FILE: ".github/steps/1-step.md"
  RENDERED_STEP_FILE: ".github/steps/rendered-step.md"

jobs:
  find_existing_exercise:
    if: ${{ !github.event.repository.is_template }}
    name: Find existing exercise issue
    runs-on: ubuntu-latest
    outputs:
      issue-number: ${{ steps.find-issue.outputs.issue-number }}

    steps:
      - name: Find canonical open exercise issue
        id: find-issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Exercise: Test and Debug with GitHub Copilot";
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const issues = items
              .filter(item => !item.pull_request && item.title === title)
              .sort((left, right) => left.number - right.number);

            if (issues.length === 0) {
              core.info("No existing open exercise issue found.");
              core.setOutput("issue-number", "");
              return;
            }

            const [canonical, ...duplicates] = issues;
            core.info(`Reusing exercise issue #${canonical.number}.`);
            core.setOutput("issue-number", canonical.number);

            for (const duplicate of duplicates) {
              core.warning(`Closing duplicate exercise issue #${duplicate.number}.`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                state: "closed",
                state_reason: "not_planned"
              });
            }

  start_exercise:
    needs: [find_existing_exercise]
    if: >-
      ${{
        !github.event.repository.is_template &&
        needs.find_existing_exercise.outputs.issue-number == ''
      }}
    name: Start Exercise
    uses: skills/exercise-toolkit/.github/workflows/start-exercise.yml@v0.9.3
    with:
      exercise-title: "Test and Debug with GitHub Copilot"
      intro-message: "A passing test suite is not the end of the story. In this exercise, you will investigate a one-cent mystery and practice verifying Copilot's suggestions with evidence."

  resolve_exercise:
    name: Resolve exercise issue
    runs-on: ubuntu-latest
    needs: [find_existing_exercise, start_exercise]
    if: >-
      ${{
        always() &&
        needs.find_existing_exercise.result == 'success' &&
        (needs.start_exercise.result == 'success' || needs.start_exercise.result == 'skipped')
      }}
    outputs:
      issue-number: ${{ steps.resolve.outputs.issue-number }}

    steps:
      - name: Resolve issue number
        id: resolve
        env:
          EXISTING_ISSUE_NUMBER: ${{ needs.find_existing_exercise.outputs.issue-number }}
          CREATED_ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}
        run: |
          issue_number="${EXISTING_ISSUE_NUMBER:-$CREATED_ISSUE_NUMBER}"
          if [ -z "$issue_number" ]; then
            echo "No exercise issue was found or created." >&2
            exit 1
          fi
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

  post_next_step_content:
    name: Post next step content
    runs-on: ubuntu-latest
    needs: [resolve_exercise]
    env:
      ISSUE_NUMBER: ${{ needs.resolve_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Render repository image URLs
        run: >-
          python .github/scripts/render_step.py
          "$STEP_1_FILE"
          "$RENDERED_STEP_FILE"
          "$GITHUB_REPOSITORY"
          "${{ github.event.repository.default_branch }}"

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.RENDERED_STEP_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Enable next step workflow
        run: gh workflow enable "Step 1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
